name: zakroma

services:
  api:
    image: dashboard-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: sqlite:////data/dashboard.db
    volumes:
      - dashboard_data:/data

  web:
    image: dashboard-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8130:80"
    depends_on:
      - api

volumes:
  dashboard_data:
